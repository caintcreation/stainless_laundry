<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 85" width="420" height="85" fill="none">
  <!-- Brand Icon -->
  <g transform="translate(5, 5)">
    <!-- Outer circle border / water bubble -->
    <circle cx="37" cy="37" r="35" stroke="#0759B8" stroke-width="3" fill="#EFF6FD"/>
    <!-- Water swirl shape -->
    <path d="M12 45 C 18 60, 48 65, 62 48 C 65 42, 63 32, 57 32 C 48 32, 45 48, 28 47 C 20 46, 15 40, 15 36 C 15 25, 30 14, 45 14" stroke="#0759B8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Water droplets -->
    <circle cx="58" cy="20" r="3" fill="#0759B8"/>
    <circle cx="48" cy="11" r="2.2" fill="#0759B8"/>
    <circle cx="65" cy="27" r="2" fill="#FFD32A"/>
    <!-- Coat Hanger -->
    <path d="M37 21 C 37 18, 39 16, 42 18 C 44 20, 41 24, 37 25 L 22 36 L 52 36 Z" fill="none" stroke="#082B63" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- T-shirt / Clean fold inside -->
    <path d="M26 36 L 22 43 L 28 45 L 30 54 L 44 54 L 46 45 L 52 43 L 48 36 Z" fill="#082B63"/>
    <path d="M33 36 Q 37 40 41 36" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
    <!-- Sparkle on shirt -->
    <path d="M37 43 L 38 46 L 41 47 L 38 48 L 37 51 L 36 48 L 33 47 L 36 46 Z" fill="#FFD32A"/>
  </g>
  <!-- Brand Name Typography -->
  <text x="88" y="38" font-family="'Poppins', sans-serif" font-weight="900" font-size="28" fill="#082B63" letter-spacing="1">STAINLESS</text>
  <text x="88" y="58" font-family="'Poppins', sans-serif" font-weight="600" font-style="normal" font-size="16" fill="#0759B8" letter-spacing="0.5">Laundry Services</text>
  <!-- Sub-slogan line -->
  <line x1="88" y1="68" x2="115" y2="68" stroke="#FFD32A" stroke-width="2"/>
  <text x="122" y="72" font-family="'Roboto', sans-serif" font-weight="700" font-size="9" fill="#082B63" letter-spacing="2.5">CLEAN | DRY | FOLD</text>
  <line x1="285" y1="68" x2="312" y2="68" stroke="#FFD32A" stroke-width="2"/>
</svg>
